<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined REST + Socket.IO Diagrams</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
            margin-top: 0;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            flex: 1;
            min-width: 150px;
            text-align: center;
        }
        .stat-card h3 {
            margin: 0;
            font-size: 32px;
        }
        .stat-card p {
            margin: 5px 0 0 0;
            opacity: 0.9;
        }
        .endpoint-list {
            display: grid;
            gap: 15px;
        }
        .endpoint-card {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: #f8f9fa;
            border-radius: 10px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s;
            border-left: 4px solid #667eea;
        }
        .endpoint-card:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .method-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 5px;
            margin-right: 15px;
            min-width: 60px;
            text-align: center;
        }
        .method-get { background: #28a745; color: white; }
        .method-post { background: #007bff; color: white; }
        .method-put { background: #ffc107; color: #333; }
        .method-patch { background: #17a2b8; color: white; }
        .method-delete { background: #dc3545; color: white; }
        .endpoint-info {
            flex: 1;
        }
        .endpoint-path {
            font-weight: 600;
            font-size: 16px;
            color: #333;
        }
        .endpoint-module {
            font-size: 13px;
            color: #666;
        }
        .event-count {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 Combined REST + Socket.IO Flow Diagrams</h1>

        <div class="stats">
            <div class="stat-card">
                <h3>2</h3>
                <p>Endpoints</p>
            </div>
            <div class="stat-card">
                <h3>2</h3>
                <p>Socket Events</p>
            </div>
            <div class="stat-card">
                <h3>1</h3>
                <p>Modules</p>
            </div>
        </div>

        <div class="endpoint-list">
            
                <a href="message-post-combined.html" class="endpoint-card">
                    <span class="method-badge method-post">POST</span>
                    <div class="endpoint-info">
                        <div class="endpoint-path">/</div>
                        <div class="endpoint-module">📦 message</div>
                    </div>
                    <span class="event-count">🔌 1 events</span>
                </a>
              
                <a href="message-postchat-chatId-read-combined.html" class="endpoint-card">
                    <span class="method-badge method-post">POST</span>
                    <div class="endpoint-info">
                        <div class="endpoint-path">/chat/:chatId/read</div>
                        <div class="endpoint-module">📦 message</div>
                    </div>
                    <span class="event-count">🔌 1 events</span>
                </a>
              
        </div>

        <div class="footer">
            <p>Generated on 11/28/2025, 5:06:59 AM</p>
            <p>Auto-detected REST endpoints that emit Socket.IO events</p>
        </div>
    </div>
</body>
</html>
